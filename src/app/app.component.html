<div class="app-shell" (click)="onDocumentClick($event)">
  <app-theme-toggle data-aos="fade-down" data-aos-duration="600"></app-theme-toggle>
  <app-header data-aos="fade-down" data-aos-duration="700"></app-header>
  <main class="app-main">
    <div>
      <app-hero-section data-aos="fade-up" data-aos-duration="900"></app-hero-section>
      <app-about-section data-aos="fade-right" data-aos-duration="800"></app-about-section>
      <app-skills-section data-aos="fade-left" data-aos-duration="800"></app-skills-section>
      <app-services-section data-aos="zoom-in" data-aos-duration="800"></app-services-section>
      <app-qualifications data-aos="fade-up" data-aos-duration="800"></app-qualifications>
      <app-projects-section data-aos="fade-up" data-aos-duration="800"></app-projects-section>
    </div>
    <app-contact-section data-aos="fade-up" data-aos-duration="800"></app-contact-section>
  </main>
  <app-footer data-aos="fade-up" data-aos-duration="700"></app-footer>
</div>
