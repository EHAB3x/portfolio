<footer class="footer">
  <div class="footer__container container">
    <a href="#home" class="footer__logo">Ihab</a>

    <ul class="footer__list">
      <li><a href="#about" class="footer__link">About</a></li>
      <li><a href="#skills" class="footer__link">Skills</a></li>
      <li><a href="#services" class="footer__link">Services</a></li>
      <li><a href="#projects" class="footer__link">Projects</a></li>
      <li><a href="#contact" class="footer__link">Contact</a></li>
    </ul>

    <div class="footer__social">
      @for (item of footerSocialLinks; track item.link) {
      <a
        [href]="item.link"
        class="footer__social-link"
        target="_blank"
        rel="noreferrer"
        aria-label="Social profile"
      >
        <ng-icon [name]="item.svg" aria-hidden="true"></ng-icon>
      </a>
      }
    </div>

    <span class="footer__copy">© Ihab Mahmoud. All rights reserved.</span>
  </div>
</footer>
