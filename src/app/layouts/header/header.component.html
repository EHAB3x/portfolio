<header class="header" #scrollHeader>
  <nav class="nav container">
    <a routerLink="/" class="nav__logo">
      <span class="nav__logo-mark" aria-hidden="true">I</span>
      <span>Ihab</span>
    </a>

    <div class="nav__menu" [class.show-menu]="showMenu">
      <ul class="nav__list">
        @for (item of navLinksArray; track item.id) {
        <li class="nav__item">
          <a
            [href]="'#' + item.id"
            class="nav__link"
            [class.active-link]="activeLink === item.id"
            (click)="setActiveLink(item.id)"
          >
            <ng-icon [name]="item.svg" class="nav__icon" aria-hidden="true" />
            <span>{{ item.name }}</span>
          </a>
        </li>
        }
      </ul>

      <button
        type="button"
        class="nav__close"
        (click)="toggleMenu()"
        aria-label="Close navigation menu"
      >
        <ng-icon name="bootstrapX" aria-hidden="true"></ng-icon>
      </button>
    </div>

    <button
      type="button"
      class="nav__toggle"
      (click)="toggleMenu()"
      aria-label="Open navigation menu"
    >
      <ng-icon name="bootstrapGrid" aria-hidden="true"></ng-icon>
    </button>
  </nav>
</header>
