<button
  type="button"
  class="theme"
  (click)="changeTheme()"
  [attr.aria-label]="currentTheme ? 'Switch to light mode' : 'Switch to dark mode'"
  [attr.aria-pressed]="currentTheme"
>
  @if (currentTheme) {
  <ng-icon name="faSolidSun" aria-hidden="true"></ng-icon>
  } @else {
  <ng-icon name="faSolidMoon" aria-hidden="true"></ng-icon>
  }
</button>
