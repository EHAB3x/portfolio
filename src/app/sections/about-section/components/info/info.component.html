<div class="about__info grid">
  @for (item of aboutConstantsArray; track item.svg) {
  <div class="about__box">
    <ng-icon [name]="item.svg" class="about__icon" aria-hidden="true"></ng-icon>
    <h3 class="about__title">{{ item.name }}</h3>
    <span class="about__subtitle">{{ item.desc }}</span>
  </div>
  }
</div>
