<section class="qualification section container">
  <h2 class="section__title">Qualification</h2>
  <span class="section__subtitle">
    My personal journey
  </span>

  @if (loading) {
  <app-loader label="Loading qualifications" data-aos="fade-up" data-aos-duration="600"></app-loader>
  } @else if (errorMessage) {
  <p class="data-state data-state--error" role="alert">{{ errorMessage }}</p>
  } @else {
  <div class="qualification__container">
    <div class="qualification__tabs" role="tablist" aria-label="Qualification type">
      <button
        type="button"
        class="qualification__button button__flex"
        [class.qualification__active]="activeTab === false"
        role="tab"
        [attr.aria-selected]="activeTab === false"
        (click)="setActiveTab(false)"
      >
        <ng-icon name="heroAcademicCap" class="qualification__icon" aria-hidden="true"></ng-icon>
        Education
      </button>

      <button
        type="button"
        class="qualification__button button__flex"
        [class.qualification__active]="activeTab === true"
        role="tab"
        [attr.aria-selected]="activeTab === true"
        (click)="setActiveTab(true)"
      >
        <ng-icon name="heroBriefcase" class="qualification__icon" aria-hidden="true"></ng-icon>
        Experience
      </button>
    </div>

    <div class="qualification__sections">
      @if(activeTab === false){
      <app-qualification-data
        [qualifications]="educations"
        data-aos="fade-up"
        data-aos-duration="700"
      ></app-qualification-data>
      }@else {
      <app-qualification-data
        [qualifications]="experiences"
        data-aos="fade-up"
        data-aos-duration="700"
      ></app-qualification-data>
      }
    </div>
  </div>
  }
</section>
