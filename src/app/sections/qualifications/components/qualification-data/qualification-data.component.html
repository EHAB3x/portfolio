<div class="qualification__content">
  @for (item of qualifications; track item.id) {
  <div class="qualification__data">
    <div *ngIf="$index % 2 !== 0"></div>
    <div [ngClass]="$index % 2 !== 0 ? 'qualification__right' : ''">
      <h3 class="qualification__title">{{ item.title }}</h3>
      <span class="qualification__subtitle">{{ item.country }} - {{ item.place }}</span>
      <div class="qualification__calender">
        <ng-icon name="featherCalendar" aria-hidden="true"></ng-icon>
        {{ item.date }}
      </div>
    </div>

    <div>
      <span class="qualification__rounder"></span>
      <span class="qualification__line"></span>
    </div>
  </div>
  }
</div>
