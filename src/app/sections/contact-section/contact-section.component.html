<div class="contact section container" id="contact">
  <h2 class="section__title">Get in touch</h2>
  <span class="section__subtitle">Contact me</span>

  <div class="contact__content">
    <form [formGroup]="contactForm" class="contact__form" (submit)="sendEmail($event)">
      <div class="contact__form-group">
        <input
          type="text"
          name="name"
          formControlName="name"
          class="contact__form-control"
          id="name"
          placeholder=" "
          required
          aria-required="true"
        />
        <label for="name" class="contact__label">Name</label>
        <div *ngIf="f['name'].touched && f['name'].invalid" class="contact__error" role="alert">
          <span *ngIf="f['name'].errors?.['required']">Name is required.</span>
          <span *ngIf="f['name'].errors?.['maxLength']">Name is too long.</span>
        </div>
      </div>

      <div class="contact__form-group">
        <input
          type="email"
          name="email"
          formControlName="email"
          class="contact__form-control"
          id="email"
          placeholder=" "
          required
          aria-required="true"
        />
        <label for="email" class="contact__label">Email address</label>
        <div *ngIf="f['email'].touched && f['email'].invalid" class="contact__error" role="alert">
          <span *ngIf="f['email'].errors?.['required']">Email is required.</span>
          <span *ngIf="f['email'].errors?.['email']">Invalid email address.</span>
        </div>
      </div>

      <div class="contact__form-group">
        <input
          type="text"
          name="subject"
          formControlName="subject"
          class="contact__form-control"
          id="subject"
          placeholder=" "
          required
          aria-required="true"
        />
        <label for="subject" class="contact__label">Subject</label>
        <div *ngIf="f['subject'].touched && f['subject'].invalid" class="contact__error" role="alert">
          <span *ngIf="f['subject'].errors?.['required']">Subject is required.</span>
          <span *ngIf="f['subject'].errors?.['maxLength']">Subject is too long.</span>
        </div>
      </div>

      <div class="contact__form-group">
        <textarea
          name="email_body"
          formControlName="email_body"
          class="contact__form-control"
          id="email_body"
          rows="5"
          placeholder=" "
          required
          aria-required="true"
        ></textarea>
        <label for="email_body" class="contact__label">Message</label>
        <div *ngIf="f['email_body'].touched && f['email_body'].invalid" class="contact__error" role="alert">
          <span *ngIf="f['email_body'].errors?.['required']">Message is required.</span>
          <span *ngIf="f['email_body'].errors?.['maxLength']">Message is too long.</span>
        </div>
      </div>

      <button type="submit" class="contact__form-button button" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Sending...' : 'Submit' }}
      </button>

      <div *ngIf="submitSuccess" class="contact__success" role="status">Message sent successfully!</div>
      <div *ngIf="submitError" class="contact__error" role="alert">{{ submitError }}</div>
    </form>
  </div>
</div>
