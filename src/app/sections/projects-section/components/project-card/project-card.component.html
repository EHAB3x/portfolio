<div class="work__card">
  <img [src]="item.img" [alt]="item.title" class="work__img" />

  <h3 class="work__title">{{ item.title }}</h3>
  <a
    [href]="item.link"
    class="work__button"
    target="_blank"
    rel="noopener noreferrer"
    [attr.aria-label]="'Open live demo for ' + item.title"
  >
    Live Demo
    <ng-icon name="bootstrapArrowRight" class="work__button-icon" aria-hidden="true"></ng-icon>
  </a>
</div>
