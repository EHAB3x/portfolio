@if (loading) {
<app-loader label="Loading projects"></app-loader>
} @else if (errorMessage) {
<p class="data-state data-state--error" role="alert">{{ errorMessage }}</p>
} @else if (!filteredProjects?.length) {
<p class="data-state">No projects available yet.</p>
} @else {
<div class="work__filters" role="tablist" aria-label="Project categories">
  @for (item of categories; track item; let i = $index) {
  <button
    type="button"
    class="work__item capitalize"
    [class.active-work]="activeTab === i"
    role="tab"
    [attr.aria-selected]="activeTab === i"
    (click)="setCategory(item); setActiveTab(i)"
  >
    {{ item }}
  </button>
  }
</div>

<div class="work__container grid">
  @for (item of filteredProjects; track $index) {
  <app-project-card [item]="item"></app-project-card>
  }
</div>
}
